name: Release

# Dispara quando você publica uma release no GitHub (Releases → Draft a new release → tag vX.Y.Z).
# Ordem: confere a versão → roda todos os testes → só então empacota e anexa os zips à release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1) A tag precisa bater com a versão do manifest (falha rápido, antes dos testes).
  versao:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Conferir versão do manifest
        if: github.event_name == 'release'
        run: |
          V=$(jq -r .version manifest.json)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "::error::A tag $GITHUB_REF_NAME aponta para um commit com manifest.json na versão $V. Apague a tag e a release e crie de novo a partir do commit mais recente da main."; exit 1; }

  # 2) Os mesmos testes que rodam a cada push (unidade, empacotamento, Firefox e ponta a ponta).
  testes:
    needs: versao
    uses: ./.github/workflows/ci.yml

  # 3) Só empacota e publica se os testes passarem.
  build:
    needs: testes
    runs-on: ubuntu-24.04
    env:
      # Credenciais da loja do Firefox (AMO). Sem elas, o envio é pulado.
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Empacotar extensão (Chromium e Firefox)
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: neurotab
          path: dist/*.zip

      - name: Publicar release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip

      # 4) Envia a versão para a loja do Firefox. A Mozilla revisa e, aprovada, todo mundo atualiza sozinho.
      #    Só funciona depois da primeira publicação manual (docs/store/FIREFOX.md).
      - name: Enviar para a loja do Firefox (AMO)
        if: github.event_name == 'release' && env.AMO_JWT_ISSUER != ''
        run: >
          npx --yes web-ext@8 sign
          --channel listed
          --source-dir build/firefox
          --api-key "$AMO_JWT_ISSUER"
          --api-secret "$AMO_JWT_SECRET"
          --approval-timeout 0
          --timeout 900000
