name: Release

# Dispara quando você publica uma release no GitHub (Releases → Draft a new release → tag vX.Y.Z).
# Os pacotes (Edge/Chrome e Firefox) são gerados e anexados automaticamente à release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Conferir versão do manifest
        if: github.event_name == 'release'
        run: |
          V=$(jq -r .version manifest.json)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "manifest.json ($V) ≠ tag ($GITHUB_REF_NAME)"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Empacotar extensão (Chromium e Firefox)
        run: ./scripts/build.sh

      - name: Validar pacote do Firefox
        run: npx --yes web-ext@8 lint --source-dir build/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: neurotab
          path: dist/*.zip

      - name: Publicar release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip
