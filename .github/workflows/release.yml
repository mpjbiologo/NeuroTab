name: Release

# Dispara quando você publica uma release no GitHub (Releases → Draft a new release → tag vX.Y.Z).
# Os pacotes (Edge/Chrome e Firefox) são gerados e anexados automaticamente à release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Conferir versão do manifest
        if: github.event_name == 'release'
        run: |
          V=$(jq -r .version manifest.json)
          [ "v$V" = "${GITHUB_REF_NAME}" ] || { echo "::error::A tag $GITHUB_REF_NAME aponta para um commit com manifest.json na versão $V. Apague a tag e a release e crie de novo a partir do commit mais recente da main."; exit 1; }

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Empacotar extensão (Chromium e Firefox)
        run: ./scripts/build.sh

      - name: Validar pacote do Firefox
        run: npx --yes web-ext@8 lint --source-dir build/firefox

      - uses: actions/upload-artifact@v4
        with:
          name: neurotab
          path: dist/*.zip

      - name: Publicar release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: dist/*.zip
