<!doctype html>
<html lang="pt-BR" data-theme="futurista">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NeuroTab · Área de transferência</title>
  <meta name="description" content="Veja e envie o que você copia entre o computador e o celular, com a NeuroTab.">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#141a2e">
  <link rel="icon" href="../icon.png">
  <link rel="apple-touch-icon" href="../icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-ui); line-height: 1.5; padding: 0 0 env(safe-area-inset-bottom); }
    header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; padding: 12px 16px; background: var(--surface-strong); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
    header img { width: 30px; height: 30px; border-radius: 8px; }
    header b { font: 700 18px var(--font-display, var(--font-ui)); flex: 1; }
    header small { color: var(--text-2); }
    main { max-width: 640px; margin: 0 auto; padding: 14px 16px 120px; display: grid; gap: 12px; }
    .card { background: var(--surface-solid); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    .muted { color: var(--text-2); font-size: 14px; }
    h1 { font-size: 20px; margin: 4px 0; }
    .btn { appearance: none; border: 1px solid var(--border); background: rgba(255,255,255,.06); color: var(--text); padding: 10px 16px; border-radius: 12px; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; display: inline-flex; gap: 6px; align-items: center; justify-content: center; }
    .btn.primary { background: var(--accent); color: var(--on-accent); border: 0; }
    .btn:disabled { opacity: .5; }
    input, textarea { width: 100%; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
    textarea { min-height: 84px; resize: vertical; }
    label { display: grid; gap: 4px; font-size: 14px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .item { display: grid; gap: 6px; }
    .item .txt { white-space: pre-wrap; word-break: break-word; max-height: 9.5em; overflow: auto; }
    .item img { max-width: 100%; border-radius: 10px; }
    .item .meta { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
    .item.mine { border-style: dashed; }
    .status { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 608px; margin: 0 auto; padding: 10px 14px; border-radius: 12px; background: var(--surface-strong); border: 1px solid var(--border); text-align: center; font-size: 14px; display: none; }
    .status.show { display: block; }
    .compose { position: sticky; top: 62px; z-index: 4; }
    .choose { display: grid; gap: 10px; }
    .choose a { justify-content: flex-start; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <header>
    <img src="../icon.png" alt="">
    <b>NeuroTab</b>
    <small id="who"></small>
  </header>
  <main id="app">
    <noscript><p class="card">Ative o JavaScript para usar esta página.</p></noscript>
  </main>
  <div class="status" id="status" role="status"></div>
  <script type="module" src="cola.js"></script>
</body>
</html>
