<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="theme.css">
<script src="theme-boot.js"></script>
<title>NeuroTab</title>
<style>
  html { background: var(--bg); }
  body { margin: 0; font-family: var(--font-ui); font-size: var(--fs-md); line-height: 1.5; background: var(--bg); color: var(--text); }
  main { max-width: 920px; margin: 0 auto; padding: 22px 18px 40px; display: grid; gap: 16px; }
  h1 { font-family: var(--font-display); font-size: var(--fs-2xl, 26px); margin: 0; }
  h2 { font-size: var(--fs-lg); margin: 0 0 8px; }
  h3 { font-size: var(--fs-md); margin: 14px 0 6px; }
  section { background: var(--surface-1, var(--tint-1)); border: 1px solid var(--border); border-radius: var(--radius-lg, 16px); padding: 16px 18px; }
  section[hidden] { display: none; }
  p { margin: 6px 0; }
  .muted { color: var(--text-3); }
  .small { font-size: var(--fs-sm); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: var(--radius-sm, 8px); border: 1px solid var(--border-strong, var(--border)); background: var(--tint-1); color: var(--text); font: inherit; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--accent); color: var(--on-accent, #001018); border-color: transparent; font-weight: 600; }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn.sm { height: 30px; padding: 0 10px; font-size: var(--fs-sm); }
  .hw { display: grid; gap: 6px; }
  .hw-row { display: grid; grid-template-columns: 190px minmax(160px, 260px) 1fr; gap: 10px; align-items: center; }
  .hw-row input[type=checkbox] { width: auto; height: auto; margin: 0; }
  .hw-row > input, .hw-row > select { height: 34px; padding: 0 10px; border-radius: var(--radius-sm, 8px); border: 1px solid var(--border-strong, var(--border)); background: var(--field, var(--tint-1)); color: var(--text); font: inherit; width: 100%; box-sizing: border-box; }
  .badge { font-size: var(--fs-xs); padding: 1px 8px; border-radius: 999px; border: 1px solid var(--border); white-space: nowrap; }
  .b-ponte, .b-browser, .b-lhm { color: var(--ok); }
  .b-estimate { color: var(--warn); }
  .b-manual { color: var(--accent); }
  .b-missing, .b-unknown { color: var(--text-3); }
  .div { color: var(--warn); font-size: var(--fs-sm); }
  .grade { font-size: var(--fs-lg); font-weight: 600; }
  .purpose { margin-top: 14px; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 10px; }
  .card { border: 1px solid var(--border); border-radius: var(--radius-md, 12px); padding: 12px; display: grid; gap: 6px; align-content: start; }
  .card.main { border-color: var(--accent); }
  .card .tag { font-size: var(--fs-xs); color: var(--text-3); text-transform: uppercase; letter-spacing: .05em; }
  .card code { font-size: var(--fs-md); font-weight: 600; }
  .card ul { margin: 0; padding-left: 18px; font-size: var(--fs-sm); }
  .bar { height: 6px; border-radius: 3px; background: var(--tint-2); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--accent); }
  .guide ol { padding-left: 20px; display: grid; gap: 10px; }
  .cmd { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .cmd code { flex: 1; background: var(--tint-2); padding: 6px 10px; border-radius: 8px; font-family: var(--font-mono, monospace); font-size: var(--fs-sm); overflow-x: auto; white-space: pre; }
  .tabs { display: flex; gap: 6px; margin: 6px 0 10px; }
  .tabs .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .ok { color: var(--ok); } .warn { color: var(--warn); } .err { color: var(--bad); }
  footer { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: var(--fs-sm); color: var(--text-3); }
  @media (max-width: 680px) { .hw-row { grid-template-columns: 1fr; } }

  body { min-height: auto; }
  main { padding: 18px 18px 22px; }
  .src-line { font-size: var(--fs-sm); color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src-line a { color: inherit; }
  label.f { display: grid; gap: 4px; font-size: var(--fs-sm); color: var(--text-2); margin-top: 10px; }
  textarea, input[type=text], input[type=datetime-local], select { width: 100%; box-sizing: border-box; font: inherit; color: var(--text); background: var(--tint-1, rgba(255,255,255,.04)); border: 1px solid var(--border); border-radius: 10px; padding: 8px 10px; }
  textarea.quote { min-height: 90px; border-left: 3px solid var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-top: 10px; }
  .seg button { border: 0; background: none; color: var(--text-2); padding: 7px 12px; cursor: pointer; font: inherit; }
  .seg button[aria-pressed="true"] { background: var(--accent-soft, rgba(80,160,255,.2)); color: var(--text); }
  .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }
  .where { font-size: var(--fs-sm); padding: 6px 10px; border-radius: 8px; background: var(--tint-1, rgba(255,255,255,.04)); margin-top: 10px; }
  .result { margin-top: 12px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); max-height: 46vh; overflow: auto; line-height: 1.5; }
  .pick { display: grid; gap: 4px; max-height: 220px; overflow: auto; margin-top: 8px; }
  .pick button { text-align: left; border: 1px solid var(--border); background: none; color: var(--text); border-radius: 8px; padding: 6px 8px; cursor: pointer; font: inherit; }
  .pick button[aria-pressed="true"] { border-color: var(--accent); }
  .xgroup { margin-top: 10px; }
  .xgroup h3 { font-size: var(--fs-sm); margin: 0 0 4px; }
  .xrow { display: flex; gap: 8px; align-items: center; font-size: var(--fs-sm); }
  .img-pv { max-width: 100%; max-height: 220px; border-radius: 10px; display: block; margin-top: 8px; }
  details summary { cursor: pointer; font-size: var(--fs-sm); color: var(--text-3); margin-top: 8px; }
</style>
</head>
<body>
<main>
  <h1 id="title" style="font-size:20px;margin:0 0 4px"></h1>
  <p class="src-line" id="src"></p>
  <div id="body"></div>
  <p id="msg" class="small" aria-live="polite"></p>
</main>
<script type="module" src="capture.js"></script>
</body>
</html>
