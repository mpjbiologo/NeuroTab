<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<script src="theme-boot.js"></script>
<title>NeuroTab — salvar imagem</title>
<style>
  /* Cores e fontes: theme.css (tema escolhido nas configurações). */
  body { margin: 0; font-family: var(--font-ui); font-size: var(--fs-md); line-height: 1.5; background: var(--bg); color: var(--text); display: grid; place-items: center; min-height: 100vh; }
  main { width: min(400px, 92vw); text-align: center; }
  img { max-width: 120px; max-height: 80px; border-radius: var(--radius-sm); margin-bottom: 10px; object-fit: contain; }
  h1 { font-family: var(--font-display); font-size: var(--fs-xl); margin: 0 0 6px; }
  p { margin: 0 0 14px; color: var(--text-2); }
  b { color: var(--text); }
  button { font: inherit; padding: 8px 16px; border-radius: var(--radius-md); border: 1px solid var(--border-strong); background: var(--tint-1); color: var(--text); cursor: pointer; margin: 0 4px; }
  button:hover { background: var(--tint-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
  .msg { min-height: 20px; margin-top: 12px; }
  .ok { color: var(--ok); } .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <h1>🖼️ Salvar imagem na biblioteca</h1>
  <p>Para baixar esta imagem, a NeuroTab precisa de permissão para acessar <b id="host"></b>. A permissão vale só para esse site e pode ser removida nas configurações da extensão.</p>
  <button id="cancel">Cancelar</button>
  <button id="go" class="primary">Permitir e salvar</button>
  <p id="msg" class="msg" role="status"></p>
</main>
<script type="module" src="grant.js"></script>
</body>
</html>
